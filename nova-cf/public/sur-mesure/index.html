<!-- CUSTOM ORDER PAGE (data-page="custom"). Standard page skeleton shared by all public pages: <body data-page="..."> tells the scripts in /js which page this is; #hd (header) and #ft (footer) are filled by the scripts in /js; <main> holds this page's own content. Styles: /css/styles.css -->
<body data-page="custom">
    <div class="wrap">
        <div id="hd"></div>
        <main>
            <section class="rv">
                <h1 style="font-size:36px">Commande sur mesure</h1>
                <!-- Form ids: #cn name, #cp phone, #cd description, #sw colour swatches (drawn by custom.js), #cb budget, #send button. custom.js customPage() saves the request (POST /api/custom, admin tab "Sur mesure") and opens a WhatsApp message to the number in public/data/site.json. -->
                <div class="form">
                    <p style="margin:0 0 14px;color:var(--mut)">Décrivez l'objet, sa taille et sa couleur. Vous recevez
                        un prix et un délai avant toute impression.</p>
                    <label for="cn">Votre nom</label><input id="cn" autocomplete="name">
                    <label for="cp">Votre téléphone <small>(facultatif)</small></label><input id="cp" type="tel" autocomplete="tel" inputmode="tel">
                    <!-- Honeypot (anti-bot): invisible to people, bots fill it and the server ignores the request -->
                    <input id="cw" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
                    <label for="cd">Décrivez votre objet</label><textarea id="cd"
                        placeholder="ex. Un support de téléphone en forme de chat, 10 cm de haut"></textarea>
                    <label>Couleur</label>
                    <div class="sw" id="sw" role="group" aria-label="Couleur"></div>
                    <label for="cb">Budget en TND (facultatif)</label><input id="cb" inputmode="numeric">
                    <button class="pill" id="send" style="width:100%">Envoyer ma demande</button>
                </div>
            </section>
        </main>
        <div id="ft"></div>
    </div>
    <script src="/js/core.js" defer></script>
    <script src="/js/ui.js" defer></script>
    <script src="/js/data.js" defer></script>
    <script src="/js/custom.js" defer></script>
    <script src="/js/events.js" defer></script>
    <script src="/js/main.js" defer></script>
</body>

</html>
