<!-- PRODUCTS PAGE (data-page="shop"). Standard page skeleton shared by all public pages: <body data-page="..."> tells the scripts in /js which page this is; #hd (header) and #ft (footer) are filled by the scripts in /js; <main> holds this page's own content. Styles: /css/styles.css -->
<body data-page="shop">
    <div class="wrap">
        <div id="hd"></div>
        <main>
            <section>
                <h1 style="font-size:36px">Produits</h1>
                <!-- Search box #q, sort menu #so and category buttons #chips (categories + Promos + Favoris), all driven by /js/shop.js -->
                <div class="tools"><input id="q" type="search" placeholder="Rechercher un produit"
                        aria-label="Rechercher un produit">
                    <select id="so" aria-label="Trier les produits"><option value="">Trier : ordre de la boutique</option><option value="pa">Prix croissant</option><option value="pd">Prix décroissant</option><option value="az">Nom A–Z</option></select>
                    <div class="chips" id="chips" role="group" aria-label="Catégories"></div>
                </div>
                <!-- Product grid: filled by the scripts in /js drawGrid() from /api/catalog -->
                <div class="grid" id="grid" aria-busy="true"><div class="p sk"><span class="tile"></span><i></i><i></i></div><div class="p sk"><span class="tile"></span><i></i><i></i></div><div class="p sk"><span class="tile"></span><i></i><i></i></div><div class="p sk"><span class="tile"></span><i></i><i></i></div></div>
            </section>
        </main>
        <div id="ft"></div>
    </div>
    <script src="/js/core.js" defer></script>
    <script src="/js/ui.js" defer></script>
    <script src="/js/data.js" defer></script>
    <script src="/js/shop.js" defer></script>
    <script src="/js/events.js" defer></script>
    <script src="/js/main.js" defer></script>
</body>

</html>
