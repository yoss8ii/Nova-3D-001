<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Produit | NOVA 3D</title>
    <!-- Title, description, canonical and share tags below are rewritten by /js/product.js for the product in the address (?id=...). -->
    <meta name="description" content="Objet imprimé en 3D par NOVA 3D, fabriqué à la commande.">
    <link rel="canonical" href="https://nova.pieca.workers.dev/produits/">
    <meta property="og:type" content="product">
    <meta property="og:site_name" content="NOVA 3D">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:title" content="Produit | NOVA 3D">
    <meta property="og:description" content="Objet imprimé en 3D par NOVA 3D, fabriqué à la commande.">
    <meta property="og:url" content="https://nova.pieca.workers.dev/produits/">
    <meta property="og:image" content="https://nova.pieca.workers.dev/images/NOVA_3D_logo_transparent.png">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="/images/nova3d-favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="/images/icon-180.png">
    <script src="/js/theme.js"></script>
</head>

<!-- PRODUCT PAGE (data-page="product"). #pp is filled by productPage() in /js/product.js from /api/catalog. -->
<body data-page="product">
    <div class="wrap">
        <div id="hd"></div>
        <main>
            <section id="pp" aria-busy="true">
                <div class="pp-grid"><div class="pp-media"><div class="tile sk"></div></div><div class="pp-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
            </section>
        </main>
        <div id="ft"></div>
    </div>
    <script src="/js/core.js" defer></script>
    <script src="/js/ui.js" defer></script>
    <script src="/js/data.js" defer></script>
    <script src="/js/product.js" defer></script>
    <script src="/js/events.js" defer></script>
    <script src="/js/main.js" defer></script>
</body>

</html>
